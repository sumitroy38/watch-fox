<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Fox — Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #FAFAFA;
    --border: #E4E4E7;
    --text: #18181B;
    --text-muted: #71717A;
    --text-faint: #A1A1AA;
    --ember: #E0611E;
    --ember-bg: #FDEEE4;
    --green: #16A34A;
    --green-bg: #EFFAF2;
    --red: #DC2626;
    --red-bg: #FDECEC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .header img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    border-radius: 6px;
  }

  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }

  .header-text p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin: 2px 0 0;
  }

  .section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 12px;
  }

  .status-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
  }
  .dot.up { background: var(--green); }
  .dot.down { background: var(--red); }

  .status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--text-muted);
  }
  .badge.up { background: var(--green-bg); color: var(--green); }
  .badge.down { background: var(--red-bg); color: var(--red); }

  .status-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 10px;
  }

  button.simulate {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
    color: #FFFFFF;
    background: var(--ember);
    border: none;
    border-radius: 7px;
    padding: 11px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.simulate:hover { background: #C6520F; }
  button.simulate:disabled { opacity: 0.6; cursor: default; }

  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin: 10px 0 0;
    line-height: 1.55;
  }

  .result {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .result.show { display: block; }

  .footer {
    padding: 14px 24px;
    background: var(--panel);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="/watch-fox-logo.png" alt="Watch Fox logo" />
      <div class="header-text">
        <h1>Watch Fox</h1>
        <p>service status</p>
      </div>
    </div>

    <div class="section">
      <p class="label">Health</p>
      <div class="status-line">
        <div class="status-left">
          <div class="dot" id="statusDot"></div>
          <span class="status-text" id="statusText">checking...</span>
        </div>
        <span class="badge" id="statusBadge">—</span>
      </div>
      <p class="status-time">last checked <span id="statusTime">—</span></p>
    </div>

    <div class="section">
      <p class="label">Alert pipeline</p>
      <button class="simulate" id="simulateBtn">simulate error</button>
      <p class="hint">Logs a simulated database error to test the CloudWatch → Lambda → email alert path.</p>
      <div class="result" id="result"></div>
    </div>

    <div class="footer">GET /health · GET /simulate-error</div>
  </div>

<script>
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const statusBadge = document.getElementById('statusBadge');
  const statusTime = document.getElementById('statusTime');
  const btn = document.getElementById('simulateBtn');
  const result = document.getElementById('result');

  async function checkHealth() {
    try {
      const res = await fetch('/health');
      const data = await res.json();
      if (res.ok && data.status === 'healthy') {
        dot.className = 'dot up';
        statusText.textContent = 'operational';
        statusBadge.className = 'badge up';
        statusBadge.textContent = '200 OK';
      } else {
        dot.className = 'dot down';
        statusText.textContent = 'unexpected response';
        statusBadge.className = 'badge down';
        statusBadge.textContent = res.status;
      }
    } catch (err) {
      dot.className = 'dot down';
      statusText.textContent = 'unreachable';
      statusBadge.className = 'badge down';
      statusBadge.textContent = 'ERR';
    }
    statusTime.textContent = new Date().toLocaleTimeString();
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'simulating...';
    try {
      const res = await fetch('/simulate-error');
      const data = await res.json();
      result.textContent = res.status + ' ' + JSON.stringify(data);
      result.classList.add('show');
    } catch (err) {
      result.textContent = 'request failed: ' + err.message;
      result.classList.add('show');
    }
    btn.disabled = false;
    btn.textContent = 'simulate error';
    checkHealth();
  });

  checkHealth();
  setInterval(checkHealth, 15000);
</script>

</body>
</html>
